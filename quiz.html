<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>الاختبار الذكي</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 30px; }
        .quiz-container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .question { margin-bottom: 20px; font-size: 18px; font-weight: bold; color: #2c3e50; }
        .options { margin-bottom: 25px; }
        .option-label { display: block; background: #ecf0f1; padding: 10px; margin: 5px 0; border-radius: 5px; cursor: pointer; }
        .btn-submit { background-color: #3498db; color: white; padding: 12px 20px; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; width: 100%; }
    </style>
</head>
<body>
    <div class="quiz-container">
        <h2>أجيبي عن الأسئلة التالية بكل ثقة 🎯</h2>
        <form action="/submit" method="POST">
            {% for q in questions %}
                <div class="question">{{ loop.index }}. {{ q.question }}</div>
                <div class="options">
                    {% for option in q.options %}
                        <label class="option-label">
                            <input type="radio" name="question_{{ q.id }}" value="{{ option }}" required> {{ option }}
                        </label>
                    {% endfor %}
                </div>
            {% endfor %}
            <button type="submit" class="btn-submit">إرسال الإجابات ومعرفة النتيجة 🏁</button>
        </form>
    </div>
</body>
</html>

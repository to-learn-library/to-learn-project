<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نتيجتكِ ومستواكِ</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 40px; text-align: center; }
        .result-box { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
        .level-badge { background-color: #9b59b6; color: white; padding: 10px 20px; border-radius: 20px; display: inline-block; font-size: 20px; margin-top: 10px; }
        .book-card { background: #f9f9f9; border-right: 5px solid #3498db; padding: 15px; margin: 20px 0; text-align: right; border-radius: 4px; }
        .btn-open { background-color: #e67e22; color: white; padding: 8px 15px; border: none; border-radius: 4px; text-decoration: none; display: inline-block; margin-top: 10px; }
        .btn-retry { background-color: #7f8c8d; color: white; padding: 10px 20px; border: none; border-radius: 5px; text-decoration: none; display: inline-block; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="result-box">
        <h1>تم اكتمال الاختبار بنجاح 🎉</h1>
        <h3>درجتكِ هي: {{ score }} من أصل 3</h3>
        <div class="level-badge">مستواكِ الحالي هو: {{ level }}</div>
        
        <h2 style="margin-top: 40px; color: #2c3e50;">📚 كتب مقترحة مخصصة لمستواكِ:</h2>
        {% for book in books %}
            <div class="book-card">
                <h3>{{ book.title }}</h3>
                <p><strong>المؤلف:</strong> {{ book.author }}</p>
                <p>{{ book.desc }}</p>
                <a href="{{ book.pdf_url }}" target="_blank" class="btn-open">📖 فتح وقراءة الكتاب PDF</a>
            </div>
        {% endfor %}
        
        <a href="/" class="btn-retry">إعادة الاختبار مرة أخرى 🔄</a>
    </div>
</body>
</html>
